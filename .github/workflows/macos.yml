name: Build macOS app
on:
  push:
    branches: [test/music-session-parallel]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the Universal build after verification
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    outputs:
      package: ${{ steps.archive.outputs.name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check downloader protocol
        run: |
          python3 -m unittest discover -s tests
          python3 music-track-smoke.py --help
          node --check safari/youtube.js
          for script in build-macos.sh build-music.sh safari/build/embed.sh; do
            bash -n "$script"
          done
      - name: Build and verify macOS app
        id: archive
        env:
          YTDL_BUILD_SAFARI: "1"
          YTDL_TOOLS_PUBLIC_KEY: ${{ vars.YTDL_TOOLS_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          YTDL_BUILD_NUMBER="$((GITHUB_RUN_NUMBER + 5))" bash build-music.sh
          package="Media-Downloader-$version"
          ditto -c -k --keepParent "dist/universal/Media Downloader.app" "$package.zip"
          smoke="$(mktemp -d)"
          trap 'rm -rf "$smoke"' EXIT
          ditto -x -k "$package.zip" "$smoke"
          app="$smoke/Media Downloader.app"
          codesign --verify --deep --strict "$app"
          xcrun lipo "$app/Contents/MacOS/YouTubeDownloader" -verify_arch x86_64 arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$app/Contents/Info.plist")" = ytdl
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:1:CFBundleURLSchemes:0' "$app/Contents/Info.plist")" = mornye
          test -s "$app/Contents/Resources/music-track-smoke.py"
          xcrun lipo "$app/Contents/Frameworks/libmornye_desktop.dylib" -verify_arch x86_64 arm64
          extension="$(find "$app/Contents/PlugIns" -name '*.appex' -print -quit)"
          test -n "$extension"
          python3 -c 'import json, sys; assert json.load(open(sys.argv[1]))["description"].strip()' "$extension/Contents/Resources/manifest.json"
          test -s "$app/Contents/Resources/AppIcon.icns"
          test -s "$app/Contents/Resources/tools-update-public.pem"
          test -s "$app/Contents/Resources/bootstrap-tools.sh"
          test ! -e "$app/Contents/Resources/engine"
          test ! -e "$app/Contents/Resources/bin"
          bash -n "$app/Contents/Resources/bootstrap-tools.sh"
          shasum -a 256 "$package.zip" > "$package.zip.sha256"
          printf 'name=%s\n' "$package" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.archive.outputs.name }}
          path: |
            ${{ steps.archive.outputs.name }}.zip
            ${{ steps.archive.outputs.name }}.zip.sha256
          if-no-files-found: error

  publish:
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' && inputs.publish == true
    needs: package
    runs-on: ubuntu-latest
    concurrency: publish-ytdl-app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.package.outputs.package }}
          path: release
      - name: Publish verified macOS archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGNING_KEY: ${{ secrets.YTDL_TOOLS_SIGNING_KEY }}
          PUBLIC_KEY: ${{ vars.YTDL_TOOLS_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?Missing release publishing token}"
          version="$(cat VERSION)"
          tag="v$version"
          cd release
          zip="Media-Downloader-$version.zip"
          sha256sum --check "$zip.sha256"
          umask 077
          key="$(mktemp)"
          public="$(mktemp)"
          trap 'rm -f "$key" "$public"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          printf '%s\n' "$PUBLIC_KEY" > "$public"
          openssl dgst -sha256 -sign "$key" -out "$zip.sig" "$zip"
          openssl dgst -sha256 -verify "$public" -signature "$zip.sig" "$zip"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Media Downloader $version" --notes-file ../RELEASE_NOTES.md
          gh release upload "$tag" "$zip" "$zip.sha256" "$zip.sig" --clobber
          gh release edit "$tag" --title "Media Downloader $version" --notes-file ../RELEASE_NOTES.md --draft=false --latest
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          grep -Fxq "$zip" <<< "$assets"
          grep -Fxq "$zip.sha256" <<< "$assets"
          grep -Fxq "$zip.sig" <<< "$assets"
